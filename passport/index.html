<!doctype html>
<html lang="en" data-lg-only data-lg-path="passport/" data-lg-root="../">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passport: a daily word game | Logicers</title>
<link rel="canonical" href="https://logicers.com/passport/">
<meta name="description" content="One word a day: where did it come from? Pick its language, then watch it travel the world to yours. In six languages.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Logicers">
<meta property="og:title" content="Passport">
<meta property="og:description" content="One word a day: where did it come from? Watch it travel the world to your language.">
<meta property="og:url" content="https://logicers.com/passport/">
<meta property="og:image" content="https://logicers.com/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F1E4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080A15" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../favicon.ico?v=30ea955f6d" sizes="32x32">
<link rel="icon" href="../assets/img/favicon.svg?v=a45c4bc09b" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png?v=8975c19930">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Logicers">
<link rel="stylesheet" href="../assets/css/logicers.css?v=40b896370f">
<link rel="stylesheet" href="passport.css?v=07295a6e69">
<script src="../assets/lang/en.js?v=469f78f223"></script>
<script src="../assets/js/lang.js?v=5a777eb8f8"></script>
</head>
<body class="game" data-g="passport">

<header class="bar">
  <a class="wordmark" href="../">Logicers</a>
  <div class="bar-tools">
    <button class="chip" id="streak-chip" type="button" data-open="dlg-album">Streak 0</button>
    <button class="chip lg-chip" id="lg-chip" type="button" data-open="dlg-lang"><span class="lg-flag">🇬🇧</span> EN</button>
    <button class="chip round" id="help-btn" type="button" data-open="dlg-help" aria-label="?">?</button>
  </div>
</header>

<main class="wrap play pp" id="app" style="visibility:hidden">
  <p class="meta"><b id="m-name"></b> <span id="day-label"></span></p>

  <section class="pp-card" id="card">
    <div class="pp-word" id="word" aria-live="polite"></div>
    <p class="pp-ask" id="ask"></p>
    <div class="pp-map" id="map">
      <button class="chip round pp-replay" id="replay" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4v4.2h4.2"/></svg>
      </button>
    </div>
  </section>

  <div class="pp-low">
    <div class="pp-slot">
      <div class="pp-opts" id="opts" role="group"></div>
      <div class="pp-after off" id="after" aria-hidden="true">
        <p class="pp-own" id="own" hidden></p>
        <p class="pp-line" id="line"></p>
        <p class="pp-year" id="year" hidden></p>
        <p class="pp-src" id="src" hidden></p>
        <div class="actions endstrip">
          <button class="btn solid" id="strip-share" type="button"></button>
          <button class="btn ghost" id="strip-result" type="button"></button>
        </div>
        <p class="midnight" id="midnight"></p>
      </div>
    </div>
    <button class="pp-count" id="count" type="button" data-open="dlg-album"></button>
  </div>

  <p class="loaderr" id="loaderr" hidden><span id="loaderr-t"></span> <button class="btn ghost" id="loaderr-b" type="button"></button></p>
</main>

<dialog id="dlg-help" aria-labelledby="help-title">
  <div class="sheet">
    <button class="chip round close" type="button" data-close aria-label="×">×</button>
    <h2 id="help-title"></h2>
    <ol>
      <li id="h1"></li>
      <li id="h2"></li>
      <li id="h3"></li>
    </ol>
  </div>
</dialog>

<dialog id="dlg-album" aria-labelledby="album-title">
  <div class="sheet">
    <button class="chip round close" type="button" data-close aria-label="×">×</button>
    <h2 id="album-title"></h2>
    <p class="pp-sub" id="album-count"></p>
    <div class="pp-stampgrid" id="stampgrid"></div>
    <div class="stats">
      <div class="stat"><b id="st-played">0</b><span id="st-played-l"></span></div>
      <div class="stat"><b id="st-streak">0</b><span id="st-streak-l"></span></div>
      <div class="stat"><b id="st-best">0</b><span id="st-best-l"></span></div>
      <div class="stat"><b id="st-right">0</b><span id="st-right-l"></span></div>
    </div>
  </div>
</dialog>

<dialog id="dlg-lang" class="lg-sheet" aria-labelledby="lang-title">
  <div class="sheet lg-box">
    <button class="chip round close" type="button" data-close aria-label="×">×</button>
    <h2 class="lg-h" id="lang-title"></h2>
    <div class="lg-list" id="lang-list"></div>
  </div>
</dialog>

<dialog id="dlg-share" class="to-save" aria-labelledby="share-title">
  <div class="sheet">
    <button class="chip round close" type="button" data-close aria-label="×">×</button>
    <h2 id="share-title"></h2>
    <img class="shot" id="share-img" alt="">
    <div class="actions to-save-acts">
      <a class="btn solid" id="share-save" download="passport.png"></a>
      <button class="btn ghost" id="share-copy" type="button"></button>
      <button class="btn ghost" id="share-more" type="button" hidden></button>
    </div>
    <p class="copied" id="share-note" role="status"></p>
  </div>
</dialog>

<noscript><p style="padding:18px">This game needs JavaScript to run.</p></noscript>

<script src="../assets/js/turnsout.js?v=70c93e7371"></script>
<script src="worldmap.js?v=5dd08316cb"></script>
<script src="passport.js?v=c7215f066c"></script>
</body>
</html>
