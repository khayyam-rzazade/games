<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Since 19 Nov 2026 the daily games in Español live on Play Logicers. GitHub Pages cannot send a real redirect, so this page
     forwards at once (meta refresh, which search engines read as a permanent move), names the new page as its canonical, and
     shows a link for anyone the refresh does not move. Its row in sitemap.xml is gone. -->
<meta http-equiv="refresh" content="0; url=https://play.logicers.com/es/">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Play Español</title>
<link rel="canonical" href="https://play.logicers.com/es/">
<link rel="icon" href="../../favicon.ico?v=30ea955f6d" sizes="32x32">
<style>
:root { --bg: #FFFFFF; --ink: #0B0C10; --soft: #5F6672; --line: #E3E6EB; }
@media (prefers-color-scheme: dark) { :root { --bg: #0E1014; --ink: #F2F4F7; --soft: #9AA3B2; --line: #262B35; } }
html, body { margin: 0; block-size: 100%; background: var(--bg); color: var(--ink); }
body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { display: flex; flex-direction: column; gap: 8px; padding: 28px 36px; border: 1.5px solid var(--line); border-radius: 28px; color: inherit; text-decoration: none; }
a:hover, a:focus-visible { border-color: var(--ink); outline: none; }
b { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
span { font-size: 13px; color: var(--soft); }
</style>
</head>
<body>
<a href="https://play.logicers.com/es/"><b>Play Español</b><span>by Logicers</span></a>
</body>
</html>
