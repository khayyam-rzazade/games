<!-- Play Logicers: the icons (direction B, Gallery; chat B, 19 Nov 2026). Stroke icons on a 24 grid; the page sets the
     stroke, its width and the colour (portal.css, .ico), so a symbol carries no colour of its own. The eight kinds are
     drawn as on the canvas (bottom row), except two redrawn by chat H on 20 Nov 2026 in the same line: Knowledge is a light
     bulb (a star reads "favourite") and Sport a trophy (the ball was a near twin of Maps' globe); i-star is the "Save" mark
     (a bookmark). -->
