<!doctype html>
<html lang="en" data-lg-only data-lg-path="altitude/" data-lg-root="../">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altitude: a daily word game | Logicers</title>
<link rel="canonical" href="https://logicers.com/altitude/">
<meta name="description" content="A 2-letter word, then 3, 4, up to 8, on one budget of guesses. One a day, in six languages. How high can you get?">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Logicers">
<meta property="og:title" content="Altitude">
<meta property="og:description" content="A 2-letter word, then 3, 4, up to 8. One budget of guesses. How high can you get?">
<meta property="og:url" content="https://logicers.com/altitude/">
<meta property="og:image" content="https://logicers.com/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#E3EBF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080A15" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../favicon.ico?v=30ea955f6d" sizes="32x32">
<link rel="icon" href="../assets/img/favicon.svg?v=a45c4bc09b" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png?v=8975c19930">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Logicers">
<link rel="stylesheet" href="../assets/css/logicers.css?v=40b896370f">
<link rel="stylesheet" href="altitude.css?v=e6c804df31">
<script src="../assets/lang/en.js?v=469f78f223"></script>
<script src="../assets/js/lang.js?v=5a777eb8f8"></script>
</head>
<body class="game" data-g="altitude">
<div class="sky" aria-hidden="true"><i class="range far"></i><i class="range mid"></i><i class="cloud a"></i><i class="cloud b"></i><i class="cloud c"></i><i class="range near"></i></div>

<header class="bar">
  <a class="wordmark" href="../">Logicers</a>
  <div class="bar-tools">
    <button class="chip" id="streak-chip" type="button" data-open="dlg-album">Streak 0</button>
    <button class="chip lg-chip" id="lg-chip" type="button" data-open="dlg-lang"><span class="lg-flag">🇬🇧</span> EN</button>
    <button class="chip round" id="help-btn" type="button" data-open="dlg-help" aria-label="How to play">?</button>
  </div>
</header>

<main class="wrap play cl" id="app">
  <p class="meta"><b id="m-name">Altitude</b> <span id="day-label"></span><span class="today-n" id="today-n" hidden></span></p>
  <p class="notice" id="beat-note" hidden></p>

  <div class="ladder" id="ladder" aria-hidden="true"></div>

  <div class="boardwrap">
    <div class="board" id="board" aria-live="polite"></div>
    <p class="toast" id="toast" role="status" hidden></p>
    <p class="cheer" id="cheer" aria-hidden="true" hidden></p>
  </div>

  <div class="budget" id="budget" aria-hidden="true"></div>
  <div class="srow" id="srow">
    <button class="chip hintbtn" id="hint" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8a5.6 5.6 0 0 0-3.3 10.1c.5.4.8.9.8 1.5v.6h5v-.6c0-.6.3-1.1.8-1.5A5.6 5.6 0 0 0 10 1.8zM7.6 16h4.8v.6a1.2 1.2 0 0 1-1.2 1.2H8.8a1.2 1.2 0 0 1-1.2-1.2z"/></svg>
      <span id="hint-t">Hint</span> <b id="hint-c">−2</b>
    </button>
    <button class="giveup" id="giveup" type="button"></button>
    <p class="left" id="left"></p>
  </div>

  <div class="kb" id="kb"></div>

  <div class="actions endstrip" id="strip" hidden>
    <button class="btn solid" id="strip-share" type="button">Share</button>
    <button class="btn ghost" id="strip-result" type="button">Result</button>
  </div>
  <p class="midnight" id="midnight" hidden></p>
  <p class="loaderr" id="loaderr" hidden><span id="loaderr-t"></span> <button class="btn ghost" id="loaderr-b" type="button">Try again</button></p>
</main>

<dialog id="dlg-help" aria-labelledby="help-title">
  <div class="sheet">
    <button class="chip round close" type="button" data-close aria-label="Close">×</button>
    <h2 id="help-title">How to play</h2>
    <ol>
      <li id="h1"></li>
      <li id="h2"></li>
      <li id="h3"></li>
    </ol>
  </div>
</dialog>

<dialog id="dlg-album" aria-labelledby="album-title">
  <div class="sheet">
    <button class="chip round close" type="button" data-close aria-label="Close">×</button>
    <h2 id="album-title">Your heights</h2>
    <div class="stats">
      <div class="stat"><b id="st-played">0</b><span id="st-played-l"></span></div>
      <div class="stat"><b id="st-streak">0</b><span id="st-streak-l"></span></div>
      <div class="stat"><b id="st-best">0</b><span id="st-best-l"></span></div>
      <div class="stat"><b id="st-height">0</b><span id="st-height-l"></span></div>
    </div>
  </div>
</dialog>

<dialog id="dlg-give" aria-labelledby="give-title">
  <div class="sheet give">
    <button class="chip round close" type="button" data-close aria-label="Close">×</button>
    <div id="give-step1">
      <h2 id="give-title"></h2>
      <p class="give-sub" id="give-sub"></p>
      <div class="give-acts">
        <button class="btn solid" id="give-hint" type="button" hidden></button>
        <button class="btn ghost" id="give-stay" type="button"></button>
        <button class="give-show" id="give-show" type="button"></button>
      </div>
    </div>
    <div id="give-step2" hidden>
      <h2 id="give-title2"></h2>
      <div class="give-acts">
        <button class="btn solid" id="give-back" type="button"></button>
        <button class="give-show" id="give-yes" type="button"></button>
      </div>
    </div>
  </div>
</dialog>

<!-- Earning a hint (29 Oct 2026, Khayyam): one question at a time, from Logicers' own puzzle data. A wrong
     answer costs nothing — the right one is shown and another question is offered. After a right answer the
     player chooses: earn the second hint now, or go back to the climb. -->
<dialog id="dlg-q" aria-labelledby="q-title">
  <div class="sheet q">
    <button class="chip round close" type="button" data-close aria-label="Close">×</button>
    <p class="q-kicker" id="q-kicker"></p>
    <h2 id="q-title"></h2>
    <div class="q-opts" id="q-opts"></div>
    <div class="q-after" id="q-after" hidden>
      <p class="q-said" id="q-said"></p>
      <div class="give-acts">
        <button class="btn solid" id="q-more" type="button"></button>
        <button class="btn ghost" id="q-play" type="button"></button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="dlg-lang" class="lg-sheet" aria-labelledby="lang-title">
  <div class="sheet lg-box">
    <button class="chip round close" type="button" data-close aria-label="Close">×</button>
    <h2 class="lg-h" id="lang-title">Language</h2>
    <div class="lg-list" id="lang-list"></div>
  </div>
</dialog>

<dialog id="dlg-share" class="to-save" aria-labelledby="share-title">
  <div class="sheet">
    <button class="chip round close" type="button" data-close aria-label="Close">×</button>
    <h2 id="share-title">Share how high you got</h2>
    <img class="shot" id="share-img" alt="">
    <div class="actions to-save-acts">
      <a class="btn solid" id="share-save" download="altitude.png">Save picture</a>
      <button class="btn ghost" id="share-copy" type="button">Copy text</button>
      <button class="btn ghost" id="share-more" type="button" hidden>More ways</button>
    </div>
    <p class="copied" id="share-note" role="status"></p>
  </div>
</dialog>

<noscript><p style="padding:18px">This game needs JavaScript to run.</p></noscript>

<script src="../assets/js/turnsout.js?v=70c93e7371"></script>
<script src="altitude.js?v=176f1b526c"></script>
</body>
</html>
