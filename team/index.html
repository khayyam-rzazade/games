<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Logicers">
<meta property="og:title" content="A country's team on Logicers">
<meta property="og:description" content="Every game a country's players finish counts for their team. See how your country is doing today, and bring friends.">
<meta property="og:image" content="https://logicers.com/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>Team page | Logicers</title>
<link rel="canonical" href="https://logicers.com/world/">
<meta name="theme-color" content="#F3F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080A15" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../favicon.ico?v=30ea955f6d" sizes="32x32">
<link rel="icon" href="../assets/img/favicon.svg?v=a45c4bc09b" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png?v=8975c19930">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Logicers">
<link rel="stylesheet" href="../assets/css/logicers.css?v=a45ddb50d8">
<link rel="stylesheet" href="../world/world.css?v=100c2bc5ac">
<link rel="stylesheet" href="team.css?v=c7d32afaf2">
</head>
<body class="game wt-page tm-page" data-g="world">

<header class="bar">
  <a class="wordmark" href="../">Logicers</a>
  <div class="bar-tools">
    <a class="chip" href="../world/">World table</a>
  </div>
</header>

<main class="wrap wt-wrap" id="app">
  <p class="meta"><b>Team page</b> <span id="tm-date"></span></p>

  <section class="tm-hero" id="tm-hero" aria-live="polite">
    <p class="wt-wait" id="tm-wait">Counting the team…</p>
  </section>

  <div class="tm-acts" id="tm-acts" hidden>
    <div class="wt-duo" id="tm-duo"></div>
    <a class="wt-play" id="tm-play" href="../"><span class="wt-play-text"><span class="wt-play-kicker" id="tm-play-kicker">Today's games</span><b>Play for the team</b></span>
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4 10h11M10.5 5.5L15 10l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <p class="wd-note" id="tm-note" role="status" hidden></p>
  </div>

  <section class="wt-card" id="tm-bar-card" hidden aria-labelledby="tm-bar-h">
    <h2 class="wt-h2" id="tm-bar-h">Team bar</h2>
    <div class="tm-bar" id="tm-bar" role="img"><i></i></div>
    <p class="wt-note" id="tm-bar-note"></p>
  </section>

  <section class="wt-card" id="tm-best-card" hidden aria-labelledby="tm-best-h">
    <h2 class="wt-h2" id="tm-best-h">Best games today</h2>
    <ol class="wt-list tm-best" id="tm-best"></ol>
    <p class="wt-note" id="tm-best-note"></p>
  </section>

  <section class="wt-card" id="tm-feel-card" hidden aria-labelledby="tm-feel-h">
    <h2 class="wt-h2" id="tm-feel-h">How the team felt</h2>
    <div class="tm-feel" id="tm-feel"></div>
    <p class="wt-note" id="tm-feel-note"></p>
  </section>

  <section class="wt-card" id="tm-rec-card" hidden aria-labelledby="tm-rec-h">
    <h2 class="wt-h2" id="tm-rec-h">Record day</h2>
    <p class="tm-rec" id="tm-rec"></p>
  </section>

  <section class="wt-card" id="tm-vs-card" hidden aria-labelledby="tm-vs-h">
    <h2 class="wt-h2" id="tm-vs-h">Face a rival</h2>
    <label class="tm-pick"><span class="quiet">Compare with</span>
      <select id="tm-rival"><option value="">Choose a country</option></select>
    </label>
    <div class="tm-vs" id="tm-vs" hidden></div>
    <button class="wt-share tm-vs-share" id="tm-vs-share" type="button" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 12.5V3.2M6.4 6.6L10 3l3.6 3.6M5.5 9.5H4.6v7h10.8v-7h-.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Share the face-off</span>
    </button>
  </section>

  <div class="tm-share-row" id="tm-share-row" hidden>
    <button class="wt-share" id="tm-share" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 12.5V3.2M6.4 6.6L10 3l3.6 3.6M5.5 9.5H4.6v7h10.8v-7h-.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Share the team picture</span>
    </button>
  </div>

  <p class="wt-foot quiet" id="tm-foot"></p>
</main>

<dialog id="dlg-share" aria-labelledby="share-title">
  <div class="sheet">
    <button class="chip round close" type="button" data-close aria-label="Close">×</button>
    <h2 id="share-title">Share the team</h2>
    <p class="quiet">Post the picture with the text, so others can tap the link and join the team.</p>
    <img class="shot" id="share-img" alt="The team as a picture: its flag, its places and its games today.">
    <div class="actions">
      <a class="btn solid" id="share-save" download="logicers-team.png">Save picture</a>
      <button class="btn ghost" id="share-copy" type="button">Copy text</button>
    </div>
    <p class="copied" id="share-copied" role="status"></p>
  </div>
</dialog>

<noscript><p style="padding:18px">This page needs JavaScript to run.</p></noscript>

<script src="../assets/js/turnsout.js?v=fb74e331df"></script>
<script src="../assets/js/points.js?v=8a8e435a1b"></script>
<script src="../assets/js/world.js?v=68caadf206"></script>
<script src="team.js?v=61181f454e"></script>
</body>
</html>
