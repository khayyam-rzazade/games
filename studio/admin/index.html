<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; default-src 'self'; script-src 'self'; style-src 'self' https://logicers.com; img-src 'self' data: blob:; font-src 'self' https://logicers.com; connect-src 'self'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; require-trusted-types-for 'script'; trusted-types 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queue | Logicers</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080A15" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://logicers.com/assets/css/logicers.css?v=6c9520ef4a">
<link rel="stylesheet" href="../studio.css?v=cfa4de13be">
<link rel="stylesheet" href="admin.css?v=5c1e817bb6">
</head>
<body class="qa-page">

<!-- Khayyam's queue: by.logicers.com/admin/. 9 Nov 2026: one card per game, with everything in it (the maker, the code,
     the link, its state, every question with its answer, the pictures with Remove, the About text, every link, the reports,
     and what is new since his last look), and one set of buttons per game. Not linked from anywhere, kept out of search
     engines. Its security line is strict: only this site's own files run, only this server is called, no inline code, and
     the browser refuses HTML put in by a script (Trusted Types), so text written by strangers can never become code next to
     the key. The key is asked for once per session: it stays in this tab's session storage and goes inside each call. -->
<header class="qa-bar">
  <a class="qa-mark" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6.2" r="4.1" fill="#2D4FC4"/><circle cx="5.3" cy="17.8" r="4.1" fill="#D5492F"/><circle cx="18.7" cy="17.8" r="4.1" fill="#0D7D73"/></svg><span>Logicers</span></a>
  <div class="qa-bar-tools">
    <button class="qa-mini" type="button" id="aitest" hidden>Picture check</button>
    <button class="qa-mini" type="button" id="forget" hidden>Lock</button>
  </div>
</header>

<main class="qa-main" id="app">
  <section class="qa-card qa-lock" id="v-lock" aria-labelledby="lock-h">
    <h1 class="qa-h1" id="lock-h">Queue</h1>
    <p class="qa-p">New games, pictures, links and reports. For Logicers only.</p>
    <form id="lockform" action="#" autocomplete="off" novalidate>
      <label class="qa-label" for="key">Admin key</label>
      <div class="qa-keyrow">
        <input class="qa-field" id="key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="qa-btn qa-solid" type="submit" id="open">Open</button>
      </div>
      <p class="qa-err" id="lock-err" role="alert" hidden></p>
    </form>
  </section>

  <div id="v-desk" hidden>
    <div class="qa-top">
      <h1 class="qa-h1">Queue</h1>
      <div class="qa-seg" id="filter" role="group" aria-label="Show">
        <button type="button" data-f="todo" aria-pressed="true" id="tab-todo">To do</button>
        <button type="button" data-f="all" aria-pressed="false">All</button>
      </div>
      <button class="qa-mini" type="button" id="refresh">Refresh</button>
    </div>
    <p class="qa-p qa-legend"><b>Seen</b>: off To do; players notice nothing. <b>Put on the list</b>: it shows in the list of games on by.logicers.com. <b>Hide</b>: its link stops working.</p>
    <p class="qa-status" id="status" role="status" aria-live="polite" hidden></p>
    <p class="qa-err" id="desk-err" role="alert" hidden></p>
    <div id="list"></div>
    <button class="qa-mini qa-more" type="button" id="more" hidden>Load older</button>
  </div>
</main>

<noscript><p class="qa-main">The queue needs JavaScript.</p></noscript>

<script src="admin.js?v=a25729855d"></script>
</body>
</html>
