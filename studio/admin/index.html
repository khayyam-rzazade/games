<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; default-src 'self'; script-src 'self'; style-src 'self' https://logicers.com; img-src 'self' data: blob:; font-src 'self' https://logicers.com; connect-src 'self'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; require-trusted-types-for 'script'; trusted-types 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queue | Logicers</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080A15" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://logicers.com/assets/css/logicers.css">
<link rel="stylesheet" href="../studio.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="qa-page">

<!-- Khayyam's queue (8 Nov 2026): by.logicers.com/admin/. What makers made or changed, newest first, and what players
     reported. Not linked from anywhere, kept out of search engines. Like the live desk (live/admin/), its security line is
     strict: only this site's own files run, only this server is called, no inline code, and the browser refuses HTML put in by a
     script (Trusted Types), so text written by strangers can never become code next to the key. The key is asked for once per
     session: it stays in this tab's session storage (gone when the tab is closed) and goes to the server inside each call. -->
<header class="qa-bar">
  <a class="qa-mark" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6.2" r="4.1" fill="#2D4FC4"/><circle cx="5.3" cy="17.8" r="4.1" fill="#D5492F"/><circle cx="18.7" cy="17.8" r="4.1" fill="#0D7D73"/></svg><span>Logicers</span></a>
  <button class="qa-mini" type="button" id="forget" hidden>Forget the key</button>
</header>

<main class="qa-main" id="app">
  <section class="qa-card qa-lock" id="v-lock" aria-labelledby="lock-h">
    <h1 class="qa-h1" id="lock-h">Queue</h1>
    <p class="qa-p">New games, images and links from makers, and reports. For Logicers only.</p>
    <form id="lockform" action="#" autocomplete="off" novalidate>
      <label class="qa-label" for="key">Admin key</label>
      <div class="qa-keyrow">
        <input class="qa-field" id="key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="qa-btn qa-solid" type="submit" id="open">Open</button>
      </div>
      <p class="qa-err" id="lock-err" role="alert" hidden></p>
    </form>
  </section>

  <div id="v-desk" hidden>
    <div class="qa-top">
      <h1 class="qa-h1">Queue</h1>
      <div class="qa-seg" id="view" role="group" aria-label="View">
        <button type="button" data-v="queue" aria-pressed="true" id="tab-queue">Queue</button>
        <button type="button" data-v="reports" aria-pressed="false" id="tab-reports">Reports</button>
      </div>
      <button class="qa-mini" type="button" id="refresh">Refresh</button>
    </div>

    <div class="qa-filter" id="filterbar">
      <div class="qa-seg" id="filter" role="group" aria-label="Show">
        <button type="button" data-f="todo" aria-pressed="true">To do</button>
        <button type="button" data-f="all" aria-pressed="false">All</button>
      </div>
      <span class="qa-count" id="count"></span>
    </div>

    <p class="qa-status" id="status" role="status" aria-live="polite" hidden></p>
    <p class="qa-err" id="desk-err" role="alert" hidden></p>

    <div id="list"></div>
    <button class="qa-mini qa-more" type="button" id="more" hidden>Load older</button>
  </div>
</main>

<noscript><p class="qa-main">The queue needs JavaScript.</p></noscript>

<script src="admin.js"></script>
</body>
</html>
