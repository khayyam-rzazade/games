<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Logicers</title>
<style>
  /* this page can show up at any address, so it carries its own styles and needs no other file */
  :root { color-scheme: light dark; --bg: #F3F4F9; --ink: #15172B; --soft: #5D6279; --go: #2D4FC4; --on: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #080A15; --ink: #F3F4FF; --soft: #A3A9CB; --go: #7FA5FF; --on: #0A0C1A; } }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 32rem; margin: 0 auto; padding: 12vh 20px 48px; }
  .logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.03em; color: inherit; text-decoration: none; }
  .logo svg { width: 28px; height: 28px; }
  h1 { font-size: 2.3rem; line-height: 1.05; margin: 40px 0 12px; letter-spacing: -0.03em; }
  p { font-size: 1.15rem; line-height: 1.4; margin: 0 0 8px; color: var(--soft); }
  .go { display: inline-flex; align-items: center; min-height: 52px; margin-top: 22px; padding: 0 26px; border-radius: 999px; background: var(--go); color: var(--on); font-weight: 700; font-size: 1.06rem; text-decoration: none; }
</style>
</head>
<body>
<main>
  <a class="logo home" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6.2" r="4.1" fill="#3558DC"/><circle cx="5.3" cy="17.8" r="4.1" fill="#E0512F"/><circle cx="18.7" cy="17.8" r="4.1" fill="#11998B"/></svg>Logicers</a>
  <h1>This page does not exist.</h1>
  <p>The link may be old or mistyped.</p>
  <a class="go home" href="./">Go to the games</a>
</main>
<script>
/* Find the front door: on github.io the site lives in a folder, on its own domain at the top. */
(function () {
  /* the page's four lines (title, heading, line, button) in the six languages; the page shows up at any address, so they live here */
  var WORDS = {
    en: ["Page not found", "This page does not exist.", "The link may be old or mistyped.", "Go to the games"],
    it: ["Pagina non trovata", "Questa pagina non esiste.", "Il link potrebbe essere vecchio o scritto male.", "Vai ai giochi"],
    tr: ["Sayfa bulunamadı", "Böyle bir sayfa yok.", "Bağlantı eski ya da yanlış yazılmış olabilir.", "Oyunlara git"],
    es: ["Página no encontrada", "Esta página no existe.", "Puede que el enlace sea antiguo o tenga un error.", "Ir a los juegos"],
    pt: ["Página não encontrada", "Esta página não existe.", "O link pode estar antigo ou ter sido digitado errado.", "Ir para os jogos"],
    fr: ["Page introuvable", "Cette page n’existe pas.", "Le lien est peut-être ancien ou mal écrit.", "Aller aux jeux"]
  };
  var parts = window.location.pathname.split("/");
  var root = /\.github\.io$/.test(window.location.hostname) && parts[1] ? "/" + parts[1] + "/" : "/";
  if (window.location.protocol === "file:") return;
  var code = "en";
  try { code = window.localStorage.getItem("lg.findout.lang") || ""; } catch (e) { code = ""; }                          // the pick the player made on the site
  if (!WORDS[code]) { try { code = String(window.navigator.language || "").slice(0, 2).toLowerCase(); } catch (e) { code = ""; } }   // else the phone's language
  if (!WORDS[code]) code = "en";
  var w = WORDS[code];
  if (code !== "en") {
    document.documentElement.lang = code === "pt" ? "pt-BR" : code;
    document.title = w[0] + " | Logicers";
    document.querySelector("h1").textContent = w[1];
    document.querySelector("p").textContent = w[2];
    document.querySelector("a.go").textContent = w[3];
  }
  root += code === "en" ? "" : code + "/";
  Array.prototype.forEach.call(document.querySelectorAll("a.home"), function (a) { a.setAttribute("href", root); });
})();
</script>
</body>
</html>
